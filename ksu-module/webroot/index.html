<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>hush</title>
  <link rel="stylesheet" href="style.css?v=1.0">
  <script type="module" src="app.js?v=1.1"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs id="lens-defs"></defs>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 21.5s7-3.4 7-9.6V5.6L12 3 5 5.6v6.3c0 6.2 7 9.6 7 9.6Z"/>
      <path d="m9.2 12 2 2 3.8-3.9"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M19.5 5v4.5H15m4.5 0a7.8 7.8 0 1 0 .6 5.2"/>
    </symbol>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <rect x="3.5" y="5" width="17" height="14" rx="2.5"/>
      <path d="M3.5 9.2h17"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.5V12l3 2"/>
    </symbol>
    <symbol id="icon-selector" viewBox="0 0 24 24">
      <path d="m8 9.5 4-4 4 4M8 14.5l4 4 4-4"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12.5 4.5 4.5L19 7.5"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="m7 7 10 10M7 17 17 7"/>
    </symbol>
  </svg>

  <main class="page">
    <header class="nav">
      <span class="brand" aria-hidden="true">
        <svg class="icon"><use href="#icon-shield"/></svg>
      </span>
      <h1>hush</h1>
      <button id="refresh" class="icon-button glass" type="button" aria-label="刷新状态" title="刷新状态">
        <svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg>
      </button>
    </header>

    <div class="layout">
      <section id="hero" class="card status" data-state="loading" aria-label="保护状态">
        <div class="status-head" role="status">
          <p class="status-line">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status">读取中…</span>
          </p>
          <p id="status-detail" class="status-detail" hidden></p>
        </div>
        <dl class="meta">
          <div class="meta-item">
            <dt>语言</dt>
            <dd id="meta-language">—</dd>
          </div>
          <div class="meta-item">
            <dt>时区</dt>
            <dd id="meta-zone">—</dd>
          </div>
          <div class="meta-item">
            <dt>当地时间</dt>
            <dd id="meta-time" class="mono">--:--</dd>
          </div>
          <div class="meta-item">
            <dt>浏览器保护</dt>
            <dd id="meta-browsers">—</dd>
          </div>
        </dl>
      </section>

      <section class="section" aria-labelledby="settings-title">
        <h2 id="settings-title" class="section-header">保护设置</h2>
        <form id="settings">
          <div class="list">
            <label class="row" for="enabled">
              <span class="tile" aria-hidden="true">
                <svg class="icon"><use href="#icon-shield"/></svg>
              </span>
              <span id="enabled-label" class="row-title">应用保护</span>
              <span class="switch">
                <input id="enabled" type="checkbox" role="switch" aria-labelledby="enabled-label" disabled>
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>

            <label class="row" for="browsers">
              <span class="tile" aria-hidden="true">
                <svg class="icon"><use href="#icon-browser"/></svg>
              </span>
              <span class="row-text">
                <span id="browsers-label" class="row-title">浏览器保护</span>
                <span id="browsers-detail" class="row-subtitle">语言 · 时区 · WebRTC · 定位</span>
              </span>
              <span class="switch">
                <input id="browsers" type="checkbox" role="switch" aria-labelledby="browsers-label" aria-describedby="browsers-detail" disabled>
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>

            <div class="row zone-row">
              <span class="tile" aria-hidden="true">
                <svg class="icon"><use href="#icon-clock"/></svg>
              </span>
              <label id="zone-label" for="zone" class="row-title">时区与语言</label>
              <div class="picker">
                <select id="zone" disabled>
                  <option value="America/Los_Angeles">加州 · 洛杉矶</option>
                  <option value="America/New_York">美国东部 · 纽约</option>
                  <option value="Asia/Tokyo">日本 · 东京</option>
                  <option value="Asia/Taipei">台北</option>
                  <option value="Asia/Singapore">新加坡</option>
                  <option value="Europe/London">英国 · 伦敦</option>
                  <option value="UTC">UTC</option>
                </select>
                <button id="zone-trigger" type="button" aria-haspopup="dialog" aria-controls="zone-dialog"
                  aria-expanded="false" aria-labelledby="zone-label zone-value" hidden disabled>
                  <span id="zone-value"></span>
                </button>
                <svg class="icon picker-icon" aria-hidden="true"><use href="#icon-selector"/></svg>
              </div>
            </div>
          </div>
          <button id="save" class="button primary" type="submit" disabled>保存配置</button>
          <p id="feedback" class="section-footer" role="status"></p>
        </form>
      </section>
    </div>
  </main>

  <dialog id="zone-dialog" class="sheet-dialog" aria-labelledby="zone-title">
    <div class="sheet glass">
      <header class="sheet-header">
        <h2 id="zone-title">选择时区</h2>
        <button id="zone-close" class="close-button" type="button" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
      </header>
      <ul id="zone-options" class="list zone-options" role="list"></ul>
    </div>
  </dialog>

  <template id="zone-option">
    <li>
      <button type="button" class="zone-option">
        <span class="zone-option-label row-title"></span>
        <span class="zone-offset mono"></span>
        <svg class="icon zone-check" aria-hidden="true"><use href="#icon-check"/></svg>
      </button>
    </li>
  </template>
</body>
</html>
