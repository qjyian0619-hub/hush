<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local privacy check</title><style>body{font:16px system-ui;background:#f5f4ef;color:#252d2a;padding:24px;max-width:850px;margin:auto}h1{font-size:28px}pre{white-space:pre-wrap;word-break:break-word;background:white;padding:20px;border-radius:14px}p{line-height:1.6}</style>
<h1>Local privacy check</h1><p>Reports go to the local diagnostic server only. With <code>network=1</code> the WebRTC test also asks public STUN servers and an IP echo service for this browser's exit addresses; it never contacts Claude.</p><pre id="out">Checking…</pre>
<script>
const snapshot=()=>({language:navigator.language,languages:[...navigator.languages],timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,offset:new Date().getTimezoneOffset(),winterOffset:new Date('2026-01-15T12:00:00Z').getTimezoneOffset(),summerOffset:new Date('2026-07-15T12:00:00Z').getTimezoneOffset()});
const runWorker=shared=>new Promise(resolve=>{try{const source=shared?'onconnect=e=>{const p=e.ports[0];p.onmessage=()=>p.postMessage(('+snapshot.toString()+')());p.start()}':'onmessage=()=>postMessage(('+snapshot.toString()+')())';const blob=new Blob([source],{type:'text/javascript'});const url=URL.createObjectURL(blob);const worker=shared?new SharedWorker(url):new Worker(url);const port=shared?worker.port:worker;const timer=setTimeout(()=>resolve({error:'timeout'}),3000);port.onmessage=e=>{clearTimeout(timer);resolve(e.data);if(!shared)worker.terminate();else port.close();URL.revokeObjectURL(url)};if(shared)port.start();port.postMessage(1)}catch(e){resolve({error:String(e)})}});
const runFrame=()=>new Promise(resolve=>{const f=document.createElement('iframe');f.hidden=true;const handler=e=>{if(e.source===f.contentWindow){removeEventListener('message',handler);resolve(e.data);f.remove()}};addEventListener('message',handler);f.srcdoc='<script>parent.postMessage(('+snapshot.toString()+')(),"*")<\/script>';document.body.append(f);setTimeout(()=>resolve({error:'timeout'}),3000)});
const geo=()=>new Promise(resolve=>navigator.geolocation.getCurrentPosition(()=>resolve({unexpectedPositionReceived:true}),e=>resolve({errorCode:e.code,denied:e.code===1}),{timeout:2000,maximumAge:0}));

// What an address in an ICE candidate reveals. "public" and "public-ipv6" are the leaks to look for
// unless they equal the VPN exit; "mdns" is Chromium's obfuscated host name and reveals nothing.
const classify=address=>{
  if(!address)return 'none';
  if(address.endsWith('.local'))return 'mdns';
  if(address.includes(':')){const a=address.toLowerCase();if(a==='::1')return 'loopback';if(/^fe[89ab]/.test(a))return 'link-local-ipv6';if(/^f[cd]/.test(a))return 'ula-ipv6';return 'public-ipv6'}
  const [a,b]=address.split('.').map(Number);
  if(a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168))return 'private';
  if(a===100&&b>=64&&b<=127)return 'cgnat';
  if(a===198&&(b===18||b===19))return 'vpn-tun';
  if(a===127)return 'loopback';
  if(a===169&&b===254)return 'link-local';
  if(a===0)return 'unspecified';
  return 'public';
};
const parseCandidate=text=>{const p=text.replace(/^candidate:/,'').split(' ');const type=(text.match(/ typ (\S+)/)||[])[1]||'unknown';const related=(text.match(/ raddr (\S+)/)||[])[1]||'';return {type,protocol:p[2],address:p[4],kind:classify(p[4]),relatedAddress:related,relatedKind:related?classify(related):''}};
const rtc=iceServers=>new Promise(async resolve=>{let p;try{p=new RTCPeerConnection({iceServers});const candidates=[];let finished=false;const end=()=>{if(!finished){finished=true;p.close();resolve({candidateCount:candidates.length,types:candidates.map(c=>c.type),candidates})}};p.onicecandidate=e=>{if(!e.candidate)end();else if(e.candidate.candidate)candidates.push(parseCandidate(e.candidate.candidate))};p.createDataChannel('local-test');await p.setLocalDescription(await p.createOffer());setTimeout(end,iceServers.length?6000:2500)}catch(e){if(p)p.close();resolve({error:String(e)})}});
const ipEcho=async()=>{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),6000);try{const response=await fetch('https://api.ipify.org?format=json',{cache:'no-store',signal:controller.signal});const ip=(await response.json()).ip;return {ip,kind:classify(ip)}}catch(e){return {error:String(e)}}finally{clearTimeout(timer)}};
// Time zone as seen at several moments of the first page: shows whether a renderer starts with the
// wrong zone and is corrected later, or is switched to it.
const timeline=start=>new Promise(resolve=>{const marks=[{at:Math.round(start),zone:Intl.DateTimeFormat().resolvedOptions().timeZone}];let i=0;const delays=[0,50,250,1000];const next=()=>{if(i>=delays.length)return resolve(marks);setTimeout(()=>{marks.push({at:Math.round(performance.now()),zone:Intl.DateTimeFormat().resolvedOptions().timeZone});next()},delays[i++])};next()});
(async()=>{
  const startedAt = performance.now();
  const main = snapshot();
  const zoneTimeline = timeline(startedAt);
  const params = new URLSearchParams(location.search);
  const nextClient = params.get('next') || '';
  const network = params.get('network') === '1';
  const report={client:params.get('client')||'unknown',rootBridgeExposed:typeof globalThis.ksu!=='undefined',main,worker:await runWorker(false),sharedWorker:await runWorker(true),iframe:await runFrame(),geolocation:await geo(),webrtc:await rtc([])};
  report.zoneTimeline = await zoneTimeline;
  if (network) {
    report.webrtcStun = await rtc([{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302']}]);
    report.httpExit = await ipEcho();
  }
  document.querySelector('#out').textContent=JSON.stringify(report,null,2);
  window.localPrivacyReport=report;
  await fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});
  if (location.hostname === '127.0.0.1' && /^[a-z0-9_-]{1,24}$/.test(nextClient)) {
    const url = new URL('/diagnostic.html', location.href);
    url.hostname = '127.0.0.2';
    url.searchParams.set('client', nextClient);
    url.searchParams.delete('next');
    location.assign(url.href);
  }
})();
</script></html>
